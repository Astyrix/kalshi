[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tradesys"
version = "0.1.0"
description = "SPY intraday (9:30-11:00 New York) research, backtesting and paper-trading system"
requires-python = ">=3.11"
dependencies = [
    "numpy>=2", "pandas>=2.2", "pyarrow>=15", "scipy>=1.11", "pydantic>=2", "PyYAML>=6",
    "exchange_calendars>=4.5", "databento>=0.40",
]

[project.optional-dependencies]
dev = ["pytest>=8"]
dashboard = ["streamlit>=1.30", "plotly>=5"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
